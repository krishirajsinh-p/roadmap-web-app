<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Diagram Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f0f4f8;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark-mode {
            background-color: #2c3e50;
            color: #ecf0f1;
        }
        #sidebar {
            width: 250px;
            background-color: #34495e;
            color: #ecf0f1;
            transition: all 0.3s;
            overflow-y: auto;
        }
        #sidebar.collapsed {
            width: 0;
            overflow: hidden;
        }
        #sidebar h3 {
            padding: 20px;
            margin: 0;
            background-color: #2c3e50;
        }
        #file-list {
            padding: 10px;
        }
        #file-list div {
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #file-list div:hover {
            background-color: #2980b9;
        }
        #content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        #toolbar {
            background-color: #3498db;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        #toggle-sidebar, #toggle-theme {
            background-color: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
            transition: transform 0.2s;
        }
        #toggle-sidebar:hover, #toggle-theme:hover {
            transform: scale(1.1);
        }
        #diagram-container {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mermaid {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }
        body.dark-mode .mermaid {
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>Mermaid Files</h3>
        <div id="file-list"></div>
    </div>
    <div id="content">
        <div id="toolbar">
            <button id="toggle-sidebar" title="Toggle Sidebar"><i class="fas fa-bars"></i></button>
            <button id="toggle-theme" title="Toggle Dark Mode"><i class="fas fa-adjust"></i></button>
        </div>
        <div id="diagram-container"></div>
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true });

        const sidebar = document.getElementById('sidebar');
        const toggleButton = document.getElementById('toggle-sidebar');
        const toggleThemeButton = document.getElementById('toggle-theme');

        toggleButton.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            toggleButton.innerHTML = sidebar.classList.contains('collapsed') ? '<i class="fas fa-chevron-right"></i>' : '<i class="fas fa-chevron-left"></i>';
        });

        toggleThemeButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            toggleThemeButton.innerHTML = document.body.classList.contains('dark-mode') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        async function listFiles() {
            try {
                const response = await fetch('/list-files');
                const files = await response.json();
                const fileList = document.getElementById('file-list');
                fileList.innerHTML = '';
                files.forEach(file => {
                    const fileItem = document.createElement('div');
                    fileItem.textContent = file;
                    fileItem.onclick = () => loadDiagram(file);
                    fileList.appendChild(fileItem);
                });
            } catch (error) {
                console.error('Error listing files:', error);
            }
        }

        function loadDiagram(fileName) {
            const container = document.getElementById('diagram-container');
            container.innerHTML = `<pre include-mermaid="/get-file/${fileName}"></pre>`;
            processElement(container.firstChild);
        }

        function processElement(element) {
            var file = element.getAttribute("include-mermaid");
            if (file) {
                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function () {
                    if (this.readyState == 4 && this.status == 200) {
                        element.innerHTML = this.responseText;
                        element.setAttribute("class", "mermaid");
                        mermaid.init(undefined, element);
                    }
                };
                xhttp.open("GET", file, true);
                xhttp.send();
            }
        }

        listFiles();
    </script>
</body>
</html>
